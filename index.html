/* ---------- MUSIC: soft procedural piano / music-box (Web Audio) ---------- */
const MUS={on:true,ctx:null,next:0,step:0},mf=n=>440*Math.pow(2,(n-69)/12);
const PROG=[[48,[60,64,67,72]],[45,[57,60,64,69]],[41,[57,60,65,69]],[43,[55,59,62,67]]],MEL=[[76,0,0,79,0,0,76,74],[72,0,0,76,0,0,74,72],[72,0,0,77,0,0,76,74],[74,0,0,79,0,0,77,74]];
function musicStart(){if(MUS.ctx)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=MUS.ctx=new A();
 MUS.g=c.createGain();MUS.g.gain.value=MUS.on?.2:0;const d=c.createDelay(),fb=c.createGain();d.delayTime.value=.55;fb.gain.value=.38;d.connect(fb);fb.connect(d);
 MUS.bus=c.createGain();MUS.bus.connect(MUS.g);MUS.bus.connect(d);d.connect(MUS.g);MUS.g.connect(c.destination);MUS.next=c.currentTime+.2}
function mtone(f,t,d,v,type){const c=MUS.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+d+.05)}
function musicTick(){const c=MUS.ctx;if(!c||c.state!=='running')return;while(MUS.next<c.currentTime+.6){const b=MUS.step%32,bar=(b>>3)&3,i=b%8,ch=PROG[bar],t=MUS.next;
  if(i===0){mtone(mf(ch[0]),t,4,.45,'sine');ch[1].forEach(n=>mtone(mf(n-12),t,4,.06,'triangle'))}
  mtone(mf(ch[1][[0,1,2,3,2,1,3,2][i]]),t,1.4,.1,'triangle');
  const m=MEL[bar][i];if(m){mtone(mf(m),t,2,.16,'sine');mtone(mf(m+12),t,.8,.03,'sine')}
  MUS.next+=.5;MUS.step++}}
document.addEventListener('visibilitychange',()=>{if(MUS.ctx)document.hidden?MUS.ctx.suspend():MUS.ctx.resume()});
['pointerdown','keydown'].forEach(n=>addEventListener(n,()=>{if(MUS.ctx&&MUS.ctx.state==='suspended'&&!document.hidden)MUS.ctx.resume()}));
$('bMus').onclick=()=>{MUS.on=!MUS.on;if(MUS.g)MUS.g.gain.setTargetAtTime(MUS.on?.2:0,MUS.ctx.currentTime,.1);$('bMus').textContent=MUS.on?'🎵':'🔇'};
/* ---------- ANIMATION / MAIN LOOP ---------- */
function animProc(e,sp,run,talk,t,air){const P=e.P;if(!P)return;
 const k=clamp(sp/3,0,1)*(.55+.45*run),s=Math.sin(e.ph||0);let ll=s*.75*k,lr=-s*.75*k,al=-s*.7*k,ar=s*.7*k,az=0;
 if(air){ll=-.5;lr=.35;al=ar=-.9;az=.5}
 P.lL.rotation.x=ll;P.lR.rotation.x=lr;P.aL.rotation.x=al;P.aR.rotation.x=ar;
 const br=Math.sin(t*1.6)*.015;P.aL.rotation.z=.08+br-az;P.aR.rotation.z=-.08-br+az;
 P.head.rotation.x=(talk?Math.sin(t*9)*.05:0)+(e.react>0?Math.sin(e.react*9)*.15:0);
 if(P.eyes){const bk=((t*1000+(e.ph0||(e.ph0=Math.random()*3000)))%3600)<130;P.eyes.forEach(x=>x.scale.y=bk?.1:1);
 const ex=e.exT>0?e.expr:'n',m=P.mouth,sy=talk?.35+Math.abs(Math.sin(t*13))*.7:ex==='happy'?1:ex==='shy'?.55:ex==='surprised'?1.1:ex==='sad'?.6:.3;
 m.scale.set(ex==='surprised'?.6:ex==='happy'?1.4:1,sy,1);m.rotation.z=ex==='sad'?0:Math.PI;
 P.brows.forEach((b,i)=>{b.position.y=.4+(ex==='surprised'?.05:ex==='shy'?.03:0);b.rotation.z=(i?-1:1)*(ex==='sad'?.3:ex==='shy'?-.15:0)});
 P.blush.forEach(b=>b.material.opacity=ex==='shy'?.9:ex==='happy'?.55:.3)}if(talk&&!air&&k<.45){P.aR.rotation.x=-.5+Math.sin(t*5)*.25;P.aR.rotation.z=-.3}}
const clock=new THREE.Clock(),V=new THREE.Vector3(),MARK_I={label:'Talk to Mark',act:()=>startDlg()};let vy=0,gnd=true,tilt=0,tgtI=null,introT=0;
const lockMove=()=>{if(camMode||dl.ph==='booth')return true;const p=player.g.position;return SHP.some(s=>Math.abs(p.x-s.x)<(s.w||7)/2&&Math.abs(p.z-SZ)<SD/2)};
function jump(){if(sit){if(!flags.seated)standUp();return}if((st==='play'||(st==='dialogue'&&!lockMove()))&&gnd){vy=Math.sqrt(2*S.grav*S.jumpH);gnd=false}}

addEventListener('pointerdown',()=>{if(st==='intro')introT=99});
let pd=0;cv.addEventListener('touchmove',e=>{if(e.targetTouches.length===2){const a=e.targetTouches[0],b=e.targetTouches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)S.dist=clamp(S.dist-(d-pd)*.02,2,10);pd=d}else pd=0},{passive:true});
cv.addEventListener('touchend',()=>pd=0);
function collide(p,r){p.x=clamp(p.x,-BX+r,BX-r);p.z=clamp(p.z,-BZ+r,BZ-r);
 if(p.y<1.1)for(const[cx,cz,hw,hd]of COL){const qx=clamp(p.x,cx-hw,cx+hw),qz=clamp(p.z,cz-hd,cz+hd),dx=p.x-qx,dz=p.z-qz,d=Math.hypot(dx,dz);if(d<r){if(d>1e-4){p.x=qx+dx/d*r;p.z=qz+dz/d*r}else p.x+=r}}
 const nx=npc.g.position.x-p.x,nz=npc.g.position.z-p.z,nd=Math.hypot(nx,nz);if(nd<.7&&nd>1e-4){p.x=npc.g.position.x-nx/nd*.7;p.z=npc.g.position.z-nz/nd*.7}}
function insideSolid(x,y,z){if(Math.abs(x)>BX+4||Math.abs(z)>BZ+4||y<.25)return true;if(y<2.4)for(const[cx,cz,hw,hd]of COL)if(Math.abs(x-cx)<hw+.2&&Math.abs(z-cz)<hd+.2)return true;return false}
const se=x=>x*x*(3-2*x),IK=[0,1.4,4.4,7];
function loop(){requestAnimationFrame(loop);musicTick();const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(player&&st!=='start'){
  if(st==='play'||st==='dialogue'||st==='intro'||st==='cine'){
   let ix=mv.x,iy=mv.y;
   if(st==='play'||(st==='dialogue'&&!lockMove())){if(keys.KeyW||keys.ArrowUp)iy+=1;if(keys.KeyS||keys.ArrowDown)iy-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;if(keys.KeyA||keys.ArrowLeft)ix-=1}else ix=iy=0;
   const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
   const run=(keys.ShiftLeft||keys.ShiftRight||runHeld)?1:0,sp=(run?S.run:S.walk)*Math.min(1,m);
   const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz2=-Math.sin(yaw);
   const tx=(fx*iy+rx*ix)*sp,tz=(fz*iy+rz2*ix)*sp,a=1-Math.exp(-dt*(gnd?(m>0?9:12):4));
   vel.x=lerp(vel.x,tx,a);vel.z=lerp(vel.z,tz,a);
   const pp=player.g.position,ox=pp.x,oz=pp.z;
   if(sit){if(m>.2)standUp();vel.set(0,0,0)}else{
    pp.x+=vel.x*dt;pp.z+=vel.z*dt;vy-=S.grav*dt;pp.y+=vy*dt;const g=gy(pp.x,pp.z);
    if(pp.y<=g||(gnd&&vy<=0&&pp.y-g<.4)){pp.y=g;vy=0;gnd=true}
    collide(pp,.35);
    if(inWater(pp.x,pp.z)){if(!inWater(pp.x,oz))pp.z=oz;else if(!inWater(ox,pp.z))pp.x=ox;else{pp.x=ox;pp.z=oz}}}
   if(!m&&Math.hypot(vel.x,vel.z)<.15){vel.x=vel.z=0}const speed=Math.hypot(vel.x,vel.z);let target=null;
   if(speed>.3)target=Math.atan2(vel.x,vel.z);
   if(st==='dialogue'&&speed<=.3){const o=spk&&spk!==player&&spk!==npc?spk:npc;target=Math.atan2(o.g.position.x-pp.x,o.g.position.z-pp.z)};
   if(camMode==='booth')target=0;if(sit)target=null;
   if(target!==null){const d=angDiff(player.g.rotation.y,target);player.g.rotation.y+=d*(1-Math.exp(-dt*12));tilt=lerp(tilt,clamp(-d,-.5,.5),.15)}else tilt=lerp(tilt,0,.15);
   player.ph=(player.ph||0)+dt*(5+speed*1.7);
   animProc(player,gnd?speed:0,run?clamp((speed-S.walk)/(S.run-S.walk),0,1):0,dl.ph==='girl',t,!gnd);
   if(sit&&player.P){player.P.lL.rotation.x=player.P.lR.rotation.x=-1.45;player.P.aL.rotation.x=player.P.aR.rotation.x=-.45}
   if(player.P)player.g.rotation.z=tilt*.08;
   playClip(player,!gnd?'jump':speed>S.walk+.8?'run':speed>.3?'walk':'idle');
   // Mark (scripted NPC)
   const np=npc.g.position,dx=pp.x-np.x,dz=pp.z-np.z,dist=Math.hypot(dx,dz);let ny=camMode==='booth'?0:dist<6?Math.atan2(dx,dz):Math.PI,nw=0;
   if(npc.goto){const gx=npc.goto[0]-np.x,gz=npc.goto[1]-np.z,gd=Math.hypot(gx,gz);if(gd<.15)npc.goto=null;else{nw=2;np.x+=gx/gd*nw*dt;np.z+=gz/gd*nw*dt;ny=Math.atan2(gx,gz)}}else if((st==='play'||st==='dialogue')&&!(st==='dialogue'&&lockMove())&&(flags.follow||flags.goal||st==='dialogue')){const w=markWalk(np,dx,dz,dist,dt);if(w){nw=w[0];ny=w[1]}}
   npc.g.rotation.y+=angDiff(npc.g.rotation.y,ny)*(1-Math.exp(-dt*(nw?8:4)));
   npc.ph=(npc.ph||0)+dt*(5+nw*1.7);npc.react=(npc.react||0)-dt;npc.exT=(npc.exT||0)-dt;player.exT=(player.exT||0)-dt;
   if(npc.hop>0){npc.hop-=dt;np.y=Math.sin(Math.max(npc.hop,0)/.5*Math.PI)*.2}else np.y=npc.sit?-.28:gy(np.x,np.z);
   const bt=st==='dialogue'&&dl.ph==='boy'&&tw.p<tw.s.length;
   animProc(npc,nw,0,bt,t,false);if(npc.sit&&npc.P){npc.P.lL.rotation.x=npc.P.lR.rotation.x=-1.45;npc.P.aL.rotation.x=npc.P.aR.rotation.x=-.45}
   if(npc.P)npc.P.head.rotation.y=clamp(angDiff(npc.g.rotation.y,ny),-.5,.5)*.6;
   playClip(npc,nw?'walk':bt?'talk':'idle');
   updateWorld(dt,t,pp);storyTick(dt,t,pp,dist);sun.position.set(pp.x+12,22,pp.z+8);sun.target.position.copy(pp);
   // interactions
   tgtI=null;if(st==='play'){let bd=1e9;if(!sit)for(const o of INT){if(o.show&&!o.show())continue;const d=Math.hypot(pp.x-o.x,pp.z-o.z);if(d<o.r&&d<bd){bd=d;tgtI=o}}if(dist<S.interact&&pp.y<1.2&&!(tgtI&&tgtI.kp&&dist>1.6))tgtI=MARK_I}
   near=tgtI===MARK_I;
   const pr=$('prompt');pr.classList.toggle('hide',!tgtI);if(tgtI)pr.textContent=(touch?'Tap to ':'Press E to ')+tgtI.label;$('bAct').classList.toggle('on',!!tgtI);
   if(st==='dialogue'){
    if((dl.ph==='boy'||dl.ph==='girl')&&tw.p<tw.s.length){tw.p=Math.min(tw.s.length,tw.p+dt*S.dlgSpeed);$('tx').textContent=tw.s.slice(0,Math.floor(tw.p));if(tw.p>=tw.s.length&&dl.ph==='boy')afterLine()}
    for(const q of timers)q.t-=dt;const due=timers.filter(q=>q.t<=0);timers=timers.filter(q=>q.t>0);due.forEach(q=>q.f());
    if(spk){V.copy(spk.g.position);V.y+=2.15;V.project(cam);const r=dlg.getBoundingClientRect(),x=clamp((V.x*.5+.5)*innerWidth-r.left,24,r.width-24);$('tail').style.left=x+'px'}}
  }

   des=new THREE.Vector3(tg.x+Math.sin(yaw)*cp*S.dist,tg.y+Math.sin(pitch)*S.dist,tg.z+Math.cos(yaw)*cp*S.dist);
  let p=des;for(let i=10;i>=2;i--){const q=tg.clone().lerp(des,i/10);p=q;if(!insideSolid(q.x,q.y,q.z))break}
  if(st==='intro'){introT+=dt;
   const F=[[pp.x+1.6,pp.y+1.7,pp.z-2.6,pp.x,pp.y+1.3,pp.z],[pp.x+1.6,pp.y+1.7,pp.z-2.6,pp.x,pp.y+1.3,pp.z],[pp.x,9,pp.z+8,pp.x,4,-40],[p.x,p.y,p.z,tg.x,tg.y,tg.z]];
   const u=Math.min(introT,7);let i=0;while(i<2&&u>=IK[i+1])i++;const f=se(clamp((u-IK[i])/(IK[i+1]-IK[i]),0,1)),A=F[i],B=F[i+1],L=A.map((v,k)=>lerp(v,B[k],f));
   cam.position.set(L[0],L[1],L[2]);cam.lookAt(L[3],L[4],L[5]);camPos.copy(cam.position);

  else if(st==='cine'||camMode){const c=camSpec(st==='cine'?'cine':camMode,pp);camPos.lerp(c[0],1-Math.exp(-dt*(st==='cine'?2.5:camMode==='booth'?6:3)));cam.position.copy(camPos);cam.lookAt(c[1])}

 }
